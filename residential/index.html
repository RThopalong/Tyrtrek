<!DOCTYPE html>
  <html lang="en">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Residential Vulnerability Assessment Report Generator</title>

<!-- PWA: installability -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f4858">
  <meta name="background-color" content="#e9e4d8">
  <link rel="icon" type="image/png" sizes="192x192" href="../app/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="../app/icon-512.png">

  <!-- iOS home-screen behavior (Safari doesn't read manifest.json for these) -->
<link rel="apple-touch-icon" href="../app/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Home VA">
  <meta name="mobile-web-app-capable" content="yes">
  <style>
  :root{
  --ink:#1c2430;
--ink-soft:#4b5563;
--paper:#faf8f4;
  --paper-line:#e4ded2;
  --folder:#2f4858;
--folder-dark:#233a47;
--tab-active:#c17a4f;
  --accent:#8a5a3b;
--low:#5b7f5e;
--medium:#b98a35;
  --high:#b95c38;
  --critical:#a13c3c;
  --border:#d8d2c4;
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
--mono:'SF Mono',Consolas,Monaco,monospace;
}
*{box-sizing:border-box;}
body{
  margin:0;
font-family:var(--sans);
color:var(--ink);
background:#e9e4d8;
-webkit-font-smoothing:antialiased;
}
/* ---------- APP SHELL ---------- */
.app{
  display:flex;
min-height:100vh;
}
.rail{
  width:230px;
flex-shrink:0;
background:var(--folder);
color:#dfe6ea;
padding:28px 0 20px;
display:flex;
flex-direction:column;
position:sticky;
top:0;
height:100vh;
overflow-y:auto;
}
.rail-brand{
  padding:0 20px 22px;
border-bottom:1px solid rgba(255,255,255,.12);
margin-bottom:8px;
}
.rail-brand .eyebrow{
font-size:10px;
letter-spacing:.14em;
text-transform:uppercase;
color:#9fb4bf;
margin-bottom:4px;
}
.rail-brand h1{
  font-family:var(--serif);
font-size:18px;
font-weight:600;
margin:0;
line-height:1.25;
color:#fff;
}
.tab{
  position:relative;
display:flex;
align-items:center;
gap:10px;
padding:11px 20px 11px 24px;
font-size:13.5px;
color:#c7d2d8;
cursor:pointer;
border-left:3px solid transparent;
transition:background .15s, color .15s;
}
.tab .num{
font-family:var(--mono);
font-size:10px;
color:#7d95a1;
width:16px;
}
.tab:hover{ background:rgba(255,255,255,.05); color:#fff; }
.tab.active{
background:var(--folder-dark);
color:#fff;
border-left-color:var(--tab-active);
}
.tab.active .num{ color:var(--tab-active); }
.rail-footer{
  margin-top:auto;
padding:16px 20px 0;
}
.btn{
  display:inline-flex;
align-items:center;
justify-content:center;
gap:8px;
border:1px solid transparent;
border-radius:3px;
padding:10px 16px;
  font-size:13px;
  font-weight:600;
cursor:pointer;
  font-family:var(--sans);
letter-spacing:.01em;
}
.btn-primary{ background:var(--tab-active); color:#fff; }
.btn-primary:hover{ background:#a8663d; }
.btn-ghost{ background:transparent; border-color:rgba(255,255,255,.3); color:#eef2f4; width:100%; }
.btn-ghost:hover{ background:rgba(255,255,255,.08); }
.btn-outline{ background:#fff; border-color:var(--border); color:var(--ink); }
  .btn-outline:hover{ background:#f4f1ea; }
  .btn-small{ padding:6px 10px; font-size:12px; }
.btn-danger{ color:var(--critical); background:transparent; border-color:transparent; }

/* ---------- MAIN / FORM ---------- */
.main{ flex:1; padding:44px 56px 90px; max-width:900px; }
.panel{ display:none; }
  .panel.active{ display:block; animation:fade .2s ease; }
@keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

.panel-head{ margin-bottom:28px; border-bottom:1px solid var(--border); padding-bottom:16px; }
.panel-head .eyebrow{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:6px; }
.panel-head h2{ font-family:var(--serif); font-size:28px; margin:0 0 6px; }
.panel-head p{ margin:0; color:var(--ink-soft); font-size:14px; max-width:60ch; line-height:1.5; }

label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink); margin:18px 0 6px; }
label .hint{ font-weight:400; color:var(--ink-soft); font-size:11.5px; display:block; margin-top:2px; }
input[type=text], input[type=date], textarea, select{
  width:100%;
  font-family:var(--sans);
  font-size:14px;
  padding:10px 12px;
  border:1px solid var(--border);
  border-radius:3px;
  background:#fff;
  color:var(--ink);
}
    textarea{ resize:vertical; min-height:90px; line-height:1.55; }
    input:focus, textarea:focus, select:focus{ outline:2px solid var(--accent); outline-offset:1px; }
    .row{ display:flex; gap:16px; }
    .row > div{ flex:1; }

    .field-group{ background:#fff; border:1px solid var(--border); border-radius:5px; padding:18px 20px 22px; margin-bottom:16px; }

    /* photo uploader */
    .photo-drop{
      border:1.5px dashed var(--border);
      border-radius:5px;
      padding:16px;
      text-align:center;
      font-size:12.5px;
      color:var(--ink-soft);
      cursor:pointer;
      background:#fcfaf6;
    }
    .photo-drop:hover{ border-color:var(--accent); color:var(--accent); }
    .photo-grid{ display:flex; flex-wrap:wrap; gap:14px; margin-top:14px; }
    .photo-card{ width:300px; }
    .photo-card img{ width:300px; height:210px; object-fit:cover; border-radius:3px; border:1px solid var(--border); display:block; }
    .photo-card input{ margin-top:6px; font-size:11.5px; padding:6px 8px; }
    .photo-card .remove{ font-size:11px; color:var(--critical); background:none; border:none; cursor:pointer; margin-top:4px; padding:0; }

    /* category cards */
    .cat-card{ background:#fff; border:1px solid var(--border); border-radius:5px; margin-bottom:14px; overflow:hidden; }
    .cat-card-head{ display:flex; align-items:center; gap:12px; padding:14px 18px; background:#f6f3ec; cursor:pointer; }
    .cat-card-head input[type=checkbox]{ width:17px; height:17px; accent-color:var(--accent); }
    .cat-card-head .cat-name{ font-weight:700; font-size:14.5px; flex:1; font-family:var(--serif); }
    .cat-card-head .chev{ font-size:11px; color:var(--ink-soft); transition:transform .15s; }
    .cat-card.no-report .cat-card-head{ background:#efece3; }
    .cat-card.no-report .cat-name{ color:var(--ink-soft); }
    .status-select{ width:auto; font-size:12px; padding:5px 8px; }
    .cat-card.open .chev{ transform:rotate(90deg); }
    .cat-card-body{ display:none; padding:16px 20px 20px; }
    .cat-card.open .cat-card-body{ display:block; }
    .vuln-card{ background:#fbfaf6; border:1px solid var(--paper-line); border-radius:4px; padding:14px 16px 18px; margin-bottom:14px; }
    .vuln-card-top{ display:flex; align-items:center; gap:10px; }
    .vuln-index{ font-family:var(--mono); font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; flex:1; }
    .vuln-card-top .priority-select{ min-width:150px; }
    .member-card{ background:#fbfaf6; border:1px solid var(--paper-line); border-radius:4px; padding:14px 16px 18px; margin-bottom:12px; }
    .member-card-top{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
    .member-card-top .member-index{ font-family:var(--mono); font-size:11px; color:var(--ink-soft); flex:1; text-transform:uppercase; letter-spacing:.05em; }
    .member-photo-thumb{ width:64px; height:64px; object-fit:cover; border-radius:50%; border:1px solid var(--border); display:block; }
    .priority-select{ width:auto; display:inline-block; min-width:170px; }
    .cat-remove{ font-size:11px; color:var(--critical); background:none; border:none; cursor:pointer; }
    .add-cat-row{ display:flex; gap:10px; margin-top:6px; }
    .add-cat-row input{ flex:1; }

    .conclusion-table{ width:100%; border-collapse:collapse; margin-top:16px; font-size:13px; }
    .conclusion-table th, .conclusion-table td{ border:1px solid var(--border); padding:8px 10px; text-align:left; }
    .conclusion-table th{ background:#f6f3ec; font-size:11px; text-transform:uppercase; letter-spacing:.05em; }
    .pill{ display:inline-block; padding:2px 9px; border-radius:20px; font-size:11px; font-weight:700; color:#fff; }
    .pill.low{ background:var(--low); } .pill.medium{ background:var(--medium); }
    .pill.high{ background:var(--high); } .pill.critical{ background:var(--critical); }
    .pill.unrated{ background:#9aa1a8; }

    .nav-buttons{ display:flex; justify-content:space-between; margin-top:36px; padding-top:20px; border-top:1px solid var(--border); }

    /* ---------- REPORT / PRINT VIEW ---------- */
    #reportView{ display:none; background:#d9d3c4; min-height:100vh; padding:40px 0 80px; }
    #reportView.active{ display:block; }
    .toolbar{
      position:sticky; top:0; z-index:20;
      background:var(--folder-dark); color:#fff;
      padding:12px 30px; display:flex; align-items:center; justify-content:space-between;
      margin-bottom:30px;
    }
    .toolbar .toolbar-title{ font-family:var(--serif); font-size:14px; }
    .toolbar-actions{ display:flex; gap:10px; }
    .sheet{
      width:816px; min-height:1056px; margin:0 auto 26px; background:var(--paper);
      box-shadow:0 6px 24px rgba(0,0,0,.18);
      padding:70px 72px; position:relative;
    }
    .sheet.cover{ display:flex; flex-direction:column; justify-content:space-between; }
    .cover .logo-slot{ width:120px; height:120px; border-radius:4px; display:flex; align-items:center; justify-content:center; overflow:hidden; margin-bottom:26px; }
    .cover .logo-slot.empty{ border:1px dashed var(--border); }
    .cover .logo-slot img{ width:100%; height:100%; object-fit:contain; }
    
.cover .team-line{ font-size:12.5px; color:var(--ink-soft); }
    .cover .kicker{ font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:14px; }
    .cover h1{
      font-family:var(--title-font-family, var(--serif)); font-size:var(--title-font-size, 42px);
      font-weight:var(--title-font-weight, 400); font-style:var(--title-font-style, normal);
      text-decoration:var(--title-text-decoration, none); line-height:1.08; margin:0 0 10px;
    }
